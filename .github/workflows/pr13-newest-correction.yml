name: Apply PR13 newest correction

on:
  push:
    branches:
      - work/academic-relational-schema-v2-validation
    paths:
      - .github/workflows/pr13-newest-correction.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR13 branch
        uses: actions/checkout@v6
        with:
          ref: work/academic-relational-schema-v2-validation
          fetch-depth: 0

      - name: Reassemble and verify correction archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            scripts/.pr13-correction.part00 \
            scripts/.pr13-correction.part01 \
            scripts/.pr13-correction.part02a \
            scripts/.pr13-correction.part02b \
            scripts/.pr13-correction.part03 \
            scripts/.pr13-correction.part04 \
            > /tmp/pr13-correction.b64
          base64 --decode /tmp/pr13-correction.b64 > /tmp/pr13-correction.tar.gz
          echo 'e1be5a9bf90eb94faa99bedcfc68a0e6682ebf5c6d343a750c06cba4304d7bc1  /tmp/pr13-correction.tar.gz' | sha256sum --check --strict
          test "$(tar -tzf /tmp/pr13-correction.tar.gz | wc -l)" -eq 27

      - name: Apply corrected source tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/pr13-correction.tar.gz -C .
          git diff --check

      - name: Remove transport scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            scripts/.pr13-correction.part00 \
            scripts/.pr13-correction.part01 \
            scripts/.pr13-correction.part02a \
            scripts/.pr13-correction.part02b \
            scripts/.pr13-correction.part03 \
            scripts/.pr13-correction.part04 \
            .github/workflows/pr13-newest-correction.yml

      - name: Commit and push correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No correction changes to commit.'
            exit 0
          fi
          git commit -m 'fix(app): apply newest relational consumer correction'
          git push origin HEAD:work/academic-relational-schema-v2-validation
