name: Materialize admin exam revamp

on:
  push:
    branches:
      - work/admin-exam-management-revamp
    paths:
      - '.revamp-payload/**'
      - '.github/workflows/revamp-materialize.yml'

permissions:
  contents: write

jobs:
  materialize-test-commit:
    if: "${{ github.event.head_commit.message == 'ci: verify real timeout lifecycle path' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout staged branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Reconstruct exact validated candidate
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .revamp-payload/bundle.part01
            cat .revamp-payload/fix02.0 .revamp-payload/fix02.1
            cat .revamp-payload/bundle.part03 .revamp-payload/bundle.part04 .revamp-payload/bundle.part05
            cat .revamp-payload/fix06.0 .revamp-payload/fix06.1a0 .revamp-payload/fix06.1a1 .revamp-payload/fix06.1b
            cat .revamp-payload/fix07.0 .revamp-payload/fix07.1
            cat .revamp-payload/bundle.part08
            cat .revamp-payload/fix09.0 .revamp-payload/fix09.1
          } | base64 --decode > /tmp/festacol-revamp.tar.gz

          echo "42cf7b759d7f19b5ae28f3cb4720dcf51c46ec1390f1e0be036a6a236f905b14  /tmp/festacol-revamp.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/festacol-revamp.tar.gz

          cat > /tmp/revamp-sha256 <<'EOF'
          38e743f6a3d884788e7ed4e9855a20906c494b5d336061d5fb6683e6d5019585  prototype/admin.html
          55649c9be39a8fcf3762a9f4d53cdbc8b4675eaa362ea1c0c839a7be746a55d6  prototype/student.html
          ae4581e1aab0eae69dead1b42f16e26efc7d66e0ecef15532010a187f4c70be4  prototype/js/admin-app.js
          fcefba133e566336abe279b9707f10675a06ff247ba338d8b4336b01a62d5df0  prototype/js/session-store.js
          43bcc58ff2f21879b6e013872ce3ef4c09d1ee17c2e6a55016d635e229949327  prototype/js/exam-app.js
          cda1ebff5cf555bdc8f450c75913d17911c848ce718f263986c938472514b5ba  scripts/prototype-audit.mjs
          00d0306bbec6ea44c9a715b68ad69871847524709478dfeb8d372f28c2411cd3  tests/prototype.spec.js
          197ba2bcc94afd1d3ae2f25edd9f8d84a7a9b75295164f10e08a472705d22acf  scripts/state-contract.mjs
          b1a5926a04d4f7b5f8d1a571c95f0838033ee3fda4503ba9bad8847a831faf2e  prototype/assets/festacol.css
          EOF
          sha256sum --check --strict /tmp/revamp-sha256

          git apply -p0 --check .revamp-payload/browser-fixes.patch
          git apply -p0 .revamp-payload/browser-fixes.patch
          echo "87b95bda7371ed6d3d1b4c0723307f0257245e9883f0f23a894892ecc902bd0d  tests/prototype.spec.js" | sha256sum --check --strict

          git apply -p0 --check .revamp-payload/timeout-lifecycle-fix.patch
          git apply -p0 .revamp-payload/timeout-lifecycle-fix.patch
          echo "d4b1d7e89cc77d39b3fef3d9d54767def9979f8714e96cd2cd0ac9cabc786260  tests/prototype.spec.js" | sha256sum --check --strict

          rm -f \
            prototype/js/admin-core-a.js \
            prototype/js/admin-core-b.js \
            prototype/js/admin-pages-a.js \
            prototype/js/admin-pages-b.js \
            prototype/js/admin-workflows-a.js \
            prototype/js/admin-workflows-b.js \
            prototype/js/admin-details.js \
            prototype/js/admin-academic.js \
            prototype/js/admin-proctor-hotfix.js \
            prototype/js/student-proctor-hotfix.js
          rm -rf .revamp-payload

      - name: Validate source and state contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in prototype/js/*.js; do node --check "$file"; done
          node --check scripts/prototype-audit.mjs
          node --check scripts/state-contract.mjs
          node --check tests/prototype.spec.js
          npm run audit:prototype
          npm run test:contract

      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Chromium workflows
        run: npx playwright test --project=chromium --reporter=list

      - name: Commit validated materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(admin): unify exam management console"
          git push origin HEAD:work/admin-exam-management-revamp
