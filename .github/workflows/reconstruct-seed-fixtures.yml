name: Reconstruct seed fixtures

on:
  push:
    branches:
      - work/academic-relational-schema-v2-validation
    paths:
      - scripts/reconstruct-seed-fixtures.mjs
      - .github/workflows/reconstruct-seed-fixtures.yml

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/academic-relational-schema-v2-validation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct normalized fixtures
        run: node scripts/reconstruct-seed-fixtures.mjs
      - name: Commit generated fixture split
        run: |
          if git diff --quiet -- public/seed/questions.json public/seed/subjects.json; then
            echo "Fixtures already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/seed/questions.json public/seed/subjects.json
          git commit -m "data: split subject and question fixtures"
          git push origin HEAD:work/academic-relational-schema-v2-validation
