name: Apply PR13 final sandbox

on:
  push:
    branches:
      - work/academic-relational-schema-v2-validation
    paths:
      - scripts/.pr13-final-sandbox.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: work/academic-relational-schema-v2-validation
          fetch-depth: 0

      - name: Apply sandbox payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/.pr13-final-sandbox.b64 > /tmp/pr13-final-sandbox.tar.gz
          tar -xzf /tmp/pr13-final-sandbox.tar.gz -C .

          # Remove staging/diagnostic artifacts from earlier sandbox transfers.
          rm -f scripts/.sandbox-wip.part* scripts/.sandbox-wip2.part* scripts/.pr13-final-sandbox.b64
          rm -f .github/workflows/typecheck-diagnostics.yml
          rm -f .github/workflows/v2-source-snapshot.yml
          rm -f .github/workflows/task7-source-snapshot.yml
          rm -f .github/workflows/apply-pr13-final-sandbox.yml

          # The replacement supabase/realtime-webhooks.sql reads secrets from Vault.
          # Do not retain the legacy file containing a committed webhook credential.
          rm -f supabase/03-realtime-webhooks.sql

          git config user.name "RelvorLabs automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "wip(schema): sync relational cleanup sandbox"
          git push origin HEAD:work/academic-relational-schema-v2-validation
