name: Apply PR13 final sandbox

on:
  push:
    branches:
      - work/academic-relational-schema-v2-validation
    paths:
      - scripts/.pr13-final-sandbox.chunk16

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: work/academic-relational-schema-v2-validation
          fetch-depth: 0

      - name: Apply sandbox payload
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.pr13-final-sandbox.chunk* | base64 -d > /tmp/pr13-final-sandbox.tar.gz
          tar -tzf /tmp/pr13-final-sandbox.tar.gz >/dev/null
          tar -xzf /tmp/pr13-final-sandbox.tar.gz -C .

          rm -rf scripts
          rm -f .github/workflows/typecheck-diagnostics.yml
          rm -f .github/workflows/v2-source-snapshot.yml
          rm -f .github/workflows/task7-source-snapshot.yml
          rm -f .github/workflows/apply-pr13-final-sandbox.yml
          rm -f supabase/03-realtime-webhooks.sql

          git config user.name "RelvorLabs automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "wip(schema): consolidate relational cleanup session"
          git push origin HEAD:work/academic-relational-schema-v2-validation
