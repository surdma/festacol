name: V2 Source Snapshot

on:
  push:
    branches:
      - 'work/academic-relational-schema-v2-validation'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: v2-source-snapshot
          path: |
            .github/
            prisma/
            prototype/
            src/
            supabase/
            package.json
            pnpm-lock.yaml
            prisma.config.ts
            tsconfig.json
            next.config.ts
            biome.json
            components.json
          if-no-files-found: error
          retention-days: 1
