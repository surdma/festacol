name: Dependency Lock Preview

on:
  push:
    branches:
      - work/academic-relational-schema-v2-validation
    paths:
      - '.github/workflows/dependency-lock-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate lockfile diff
        run: |
          pnpm add --lockfile-only --ignore-scripts \
            katex@0.18.7 \
            apexcharts@7.3.0 \
            react-apexcharts@2.1.1 \
            qrcode.react@4.2.0
          git diff -- package.json pnpm-lock.yaml
