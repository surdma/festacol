name: Dependency Lock Apply

on:
  push:
    branches:
      - work/academic-relational-schema-v2-validation
    paths:
      - '.github/workflows/dependency-lock-preview.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: work/academic-relational-schema-v2-validation

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate and commit lockfile
        run: |
          pnpm add --lockfile-only --ignore-scripts \
            katex@0.18.7 \
            apexcharts@7.3.0 \
            react-apexcharts@2.1.1 \
            qrcode.react@4.2.0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "build: add math qr and analytics dependencies"
          git push origin HEAD:work/academic-relational-schema-v2-validation
