name: Next.js Quality

on:
  push:
    branches:
      - master
      - main
      - 'work/**'
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'supabase/**'
      - 'public/seed/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'prisma.config.ts'
      - 'tsconfig.json'
      - 'next.config.*'
      - '.github/workflows/nextjs-quality.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'supabase/**'
      - 'public/seed/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'prisma.config.ts'
      - 'tsconfig.json'
      - 'next.config.*'
      - '.github/workflows/nextjs-quality.yml'

permissions:
  contents: read

concurrency:
  group: nextjs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Prisma, relational migration, types, build & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
      PGPASSWORD: postgres
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      SUPABASE_WEBHOOK_SECRET: ci-placeholder-webhook-secret
      SETUP_SECRET: ci-placeholder-setup-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Initialize relational migration database
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key);
          create or replace function auth.uid()
          returns uuid language sql stable as $$ select null::uuid $$;
          do $$ begin create role authenticated; exception when duplicate_object then null; end $$;
          do $$ begin create role service_role; exception when duplicate_object then null; end $$;
          SQL
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/academic-relational-foundation.fixture.sql

      - name: Apply relational migrations first pass
        run: |
          for migration in \
            supabase/06-academic-relational-foundation.sql \
            supabase/07-academic-relational-foundation-hardening.sql \
            supabase/08-academic-identity-cutover.sql \
            supabase/09-curriculum-subject-offerings.sql \
            supabase/10-exam-runtime-authorization.sql \
            supabase/11-runtime-consumer-cutover.sql
          do
            echo "Applying ${migration}"
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "${migration}"
          done

      - name: Reapply migration 06
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/06-academic-relational-foundation.sql

      - name: Reapply migration 07
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/07-academic-relational-foundation-hardening.sql

      - name: Reapply migration 08
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/08-academic-identity-cutover.sql

      - name: Reapply migration 09
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/09-curriculum-subject-offerings.sql

      - name: Reapply migration 10
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/10-exam-runtime-authorization.sql

      - name: Reapply migration 11
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/11-runtime-consumer-cutover.sql

      - name: Assert relational foundation
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/academic-relational-foundation.assert.sql

      - name: Assert identity cutover
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/academic-identity-cutover.assert.sql

      - name: Assert curriculum offerings
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/curriculum-subject-offerings.assert.sql

      - name: Assert exam runtime authorization
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/exam-runtime-authorization.assert.sql

      - name: Assert runtime result FK columns
        run: |
          awk -v target=1 'BEGIN{block=0} /^do \$\$/{block++} block==target{print} block==target && /^end \$\$;/{exit}' supabase/tests/runtime-consumer-cutover.assert.sql | psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1

      - name: Assert runtime result FK backfill
        run: |
          awk -v target=2 'BEGIN{block=0} /^do \$\$/{block++} block==target{print} block==target && /^end \$\$;/{exit}' supabase/tests/runtime-consumer-cutover.assert.sql | psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1

      - name: Assert question answer secrecy
        run: |
          awk -v target=3 'BEGIN{block=0} /^do \$\$/{block++} block==target{print} block==target && /^end \$\$;/{exit}' supabase/tests/runtime-consumer-cutover.assert.sql | psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1

      - name: Assert no student answer-detail policy
        run: |
          awk -v target=4 'BEGIN{block=0} /^do \$\$/{block++} block==target{print} block==target && /^end \$\$;/{exit}' supabase/tests/runtime-consumer-cutover.assert.sql | psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1

      - name: Assert staff answer-detail policy
        run: |
          awk -v target=5 'BEGIN{block=0} /^do \$\$/{block++} block==target{print} block==target && /^end \$\$;/{exit}' supabase/tests/runtime-consumer-cutover.assert.sql | psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1

      - name: Assert attempt mutation boundary
        run: |
          awk -v target=6 'BEGIN{block=0} /^do \$\$/{block++} block==target{print} block==target && /^end \$\$;/{exit}' supabase/tests/runtime-consumer-cutover.assert.sql | psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1

      - name: Assert relational exam metadata policies
        run: |
          awk -v target=7 'BEGIN{block=0} /^do \$\$/{block++} block==target{print} block==target && /^end \$\$;/{exit}' supabase/tests/runtime-consumer-cutover.assert.sql | psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1

      - name: Assert relational admin policy
        run: |
          awk -v target=8 'BEGIN{block=0} /^do \$\$/{block++} block==target{print} block==target && /^end \$\$;/{exit}' supabase/tests/runtime-consumer-cutover.assert.sql | psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1

      - name: Establish Prisma legacy baseline
        run: pnpm exec prisma migrate resolve --applied 20260915100000_legacy_supabase_baseline

      - name: Apply Prisma migration history
        run: pnpm exec prisma migrate deploy

      - name: Apply post-Prisma Supabase integration
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/auth-rpc.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/rls.sql

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Biome lint migration surfaces
        run: >-
          pnpm exec biome lint
          prisma.config.ts
          src/app/layout.tsx
          src/app/admin/layout.tsx
          src/app/actions/admin-parity.ts
          src/app/actions/exam-state.ts
          src/app/actions/exams.ts
          src/app/dashboard/exam/page.tsx
          src/app/dashboard/exam/workspace.tsx
          src/components/admin/admin-chrome.tsx
          src/components/admin/admin-nav.tsx
          src/lib/assessment.ts
          src/lib/questions.ts
          src/lib/nav.ts
          src/types/db.ts
          src/types/exam.ts
