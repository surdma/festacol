name: Next.js Quality

on:
  push:
    branches:
      - master
      - main
      - 'work/**'
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'supabase/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'prisma.config.ts'
      - 'tsconfig.json'
      - 'next.config.*'
      - '.github/workflows/nextjs-quality.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'supabase/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'prisma.config.ts'
      - 'tsconfig.json'
      - 'next.config.*'
      - '.github/workflows/nextjs-quality.yml'

permissions:
  contents: read

concurrency:
  group: nextjs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Prisma, relational migration, types, build & admin lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
      PGPASSWORD: postgres
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      SUPABASE_WEBHOOK_SECRET: ci-placeholder-webhook-secret
      SETUP_SECRET: ci-placeholder-setup-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Validate relational schema migration
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key);
          create or replace function auth.uid()
          returns uuid language sql stable as $$ select null::uuid $$;
          do $$ begin
            create role authenticated;
          exception when duplicate_object then null;
          end $$;
          SQL
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/academic-relational-foundation.fixture.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/06-academic-relational-foundation.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/07-academic-relational-foundation-hardening.sql
          # Prove the expand/hardening migrations are re-runnable before assertions.
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/06-academic-relational-foundation.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/07-academic-relational-foundation-hardening.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/academic-relational-foundation.assert.sql

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Biome lint admin migration surface
        run: >-
          pnpm exec biome lint
          prisma.config.ts
          src/app/layout.tsx
          src/app/admin/layout.tsx
          src/app/actions/admin-parity.ts
          src/components/admin/admin-chrome.tsx
          src/components/admin/admin-nav.tsx
          src/lib/nav.ts
          src/types/db.ts
