name: Task 7 Source Snapshot

on:
  push:
    branches:
      - work/admin-experience-complete-revamp

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Upload prototype source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: task7-prototype-source
          path: prototype/
          if-no-files-found: error
          retention-days: 1
