<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Festacol secure student computer-based examination workspace">
  <meta name="theme-color" content="#000000">
  <title>Festacol · Examination</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet">
  <style type="text/tailwindcss">
    @theme {
      --font-sans: "DM Sans", sans-serif;
      --font-display: "Manrope", sans-serif;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="min-h-dvh bg-neutral-100 font-sans text-neutral-950 antialiased selection:bg-black selection:text-white">
  <a href="#app" class="fixed left-4 top-4 z-[200] -translate-y-24 rounded-lg bg-black px-4 py-2 text-sm font-semibold text-white focus:translate-y-0">Skip to examination</a>
  <div id="app" tabindex="-1" class="min-h-dvh outline-none">
    <main class="grid min-h-dvh place-items-center p-4 sm:p-6">
      <section class="w-full max-w-md rounded-2xl border border-neutral-200 bg-white p-7 text-center shadow-sm" role="status" aria-live="polite">
        <span class="mx-auto grid h-11 w-11 place-items-center rounded-xl bg-black font-display text-sm font-extrabold text-white">F</span>
        <h1 class="mt-5 font-display text-2xl font-extrabold tracking-tight text-neutral-950">Preparing your examination…</h1>
        <p class="mt-2 text-sm leading-6 text-neutral-500">Loading the session, candidate state and question paper.</p>
        <div class="mx-auto mt-6 h-1.5 w-32 overflow-hidden rounded-full bg-neutral-200" aria-hidden="true">
          <div class="h-full w-1/2 animate-pulse rounded-full bg-black motion-reduce:animate-none"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
  <script src="./js/session-store.js"></script>
  <script src="./js/proctor-policy.js"></script>
  <script src="./js/question-data.js"></script>
  <script src="./js/assessment-engine.js"></script>
  <script src="./js/exam-app.js"></script>
</body>
</html>
