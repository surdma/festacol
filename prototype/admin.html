<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Festacol administration compatibility entry point">
  <title>Festacol · Administration</title>
</head>
<body>
  <noscript><a href="./index.html?route=admin">Open Festacol Administration</a></noscript>
  <script>
    (() => {
      'use strict';
      const current = new URL(location.href);
      const target = new URL('./index.html', location.href);
      target.search = current.search;
      target.searchParams.set('route', 'admin');
      target.hash = current.hash;
      location.replace(target.href);
    })();
  </script>
</body>
</html>
