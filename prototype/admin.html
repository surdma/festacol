<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Festacol examination and academic administration prototype">
  <title>Festacol · Admin Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet">
  <style type="text/tailwindcss">
    @theme {
      --font-sans: "DM Sans", sans-serif;
      --font-display: "Manrope", sans-serif;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body class="min-h-dvh bg-neutral-50 font-sans text-neutral-950 antialiased">
  <a href="#admin-root" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100] focus:rounded-lg focus:bg-black focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-white">Skip to main content</a>

  <aside class="fixed inset-y-0 left-0 z-40 hidden w-64 border-r border-neutral-200 bg-white lg:flex lg:flex-col" aria-label="Administration navigation">
    <a href="./admin.html?page=overview" class="mx-4 mt-5 flex items-center gap-3 rounded-xl px-2 py-2 focus:outline-none focus:ring-4 focus:ring-neutral-200">
      <span class="grid size-10 place-items-center rounded-xl bg-black font-display text-sm font-extrabold text-white">F</span>
      <span class="min-w-0"><strong class="block font-display text-sm font-extrabold">Festacol</strong><span class="block text-xs text-neutral-500">Academic operations</span></span>
    </a>
    <nav id="desktop-nav" class="mt-6 grid gap-1 px-3" aria-label="Admin pages"></nav>
    <div class="mt-auto p-4">
      <div class="rounded-xl border border-neutral-200 bg-neutral-50 p-4">
        <div class="flex items-center gap-2"><span class="size-2 rounded-full bg-emerald-500"></span><strong class="text-xs">Prototype workspace</strong></div>
        <p class="mt-2 text-xs leading-5 text-neutral-500">Browser-local academic and examination records.</p>
      </div>
    </div>
  </aside>

  <div class="min-h-dvh lg:pl-64">
    <header class="sticky top-0 z-30 border-b border-neutral-200 bg-white/95 backdrop-blur-xl">
      <div class="mx-auto flex min-h-16 max-w-[1600px] items-center gap-3 px-4 sm:px-6 lg:px-8">
        <button id="mobile-nav-button" type="button" class="inline-flex size-10 items-center justify-center rounded-lg border border-neutral-300 bg-white text-neutral-800 hover:bg-neutral-100 focus:outline-none focus:ring-4 focus:ring-neutral-200 lg:hidden" aria-label="Open navigation" aria-controls="mobile-nav-dialog">
          <svg class="size-5" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="min-w-0 flex-1"><p id="admin-breadcrumb" class="truncate text-[11px] font-bold uppercase tracking-[.14em] text-neutral-500">Administration / Overview</p><h1 id="admin-page-label" class="truncate font-display text-base font-extrabold sm:text-lg">Overview</h1></div>
        <label class="relative hidden w-full max-w-xs md:block"><span class="sr-only">Search administration</span><svg class="pointer-events-none absolute left-3 top-1/2 size-4 -translate-y-1/2 text-neutral-400" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="admin-global-search" class="h-10 w-full rounded-lg border border-neutral-300 bg-neutral-50 pl-9 pr-3 text-sm focus:border-black focus:ring-black" placeholder="Search students or exams"></label>
        <button id="admin-notifications" type="button" class="hidden size-10 items-center justify-center rounded-lg border border-neutral-300 bg-white text-neutral-700 hover:bg-neutral-100 focus:outline-none focus:ring-4 focus:ring-neutral-200 sm:inline-flex" aria-label="Notifications"><svg class="size-5" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button id="admin-quick-create" type="button" class="inline-flex min-h-10 items-center justify-center gap-2 rounded-lg bg-black px-3.5 text-sm font-semibold text-white hover:bg-neutral-800 focus:outline-none focus:ring-4 focus:ring-neutral-300 sm:px-4"><svg class="size-4" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="hidden sm:inline">Create exam</span><span class="sm:hidden">Create</span></button>
      </div>
    </header>
    <div id="admin-alert" class="mx-auto hidden max-w-[1600px] px-4 pt-4 sm:px-6 lg:px-8" aria-live="polite"></div>
    <main id="admin-root" tabindex="-1" class="mx-auto max-w-[1600px] px-4 py-5 outline-none sm:px-6 sm:py-6 lg:px-8 lg:py-8"></main>
  </div>

  <dialog id="mobile-nav-dialog" class="m-0 h-dvh max-h-none w-[min(88vw,22rem)] max-w-none border-0 bg-white p-0 shadow-2xl backdrop:bg-black/40 lg:hidden">
    <div class="flex h-full flex-col">
      <div class="flex items-center justify-between border-b border-neutral-200 p-4"><div class="flex items-center gap-3"><span class="grid size-9 place-items-center rounded-lg bg-black font-display text-xs font-extrabold text-white">F</span><div><strong class="block font-display text-sm">Festacol Admin</strong><span class="text-xs text-neutral-500">Academic operations</span></div></div><button data-close-mobile-nav class="inline-flex size-10 items-center justify-center rounded-lg hover:bg-neutral-100" aria-label="Close navigation"><svg class="size-5" viewBox="0 0 24 24" fill="none"><path d="M6 18 18 6M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
      <nav id="mobile-nav" class="grid gap-1 p-3" aria-label="Mobile admin pages"></nav>
    </div>
  </dialog>

  <dialog id="admin-dialog" class="w-[calc(100%_-_1.5rem)] max-w-4xl rounded-2xl border border-neutral-200 bg-white p-0 shadow-2xl backdrop:bg-black/45 sm:w-[calc(100%_-_3rem)]" aria-labelledby="admin-dialog-title">
    <div id="admin-dialog-content" class="max-h-[90dvh] overflow-y-auto overscroll-contain"></div>
  </dialog>

  <div id="toast-stack" class="pointer-events-none fixed inset-x-4 top-4 z-[120] ml-auto grid max-w-sm gap-2 sm:left-auto" aria-live="polite" aria-atomic="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
  <script src="./js/session-store.js"></script>
  <script src="./js/proctor-policy.js"></script>
  <script src="./js/question-data.js"></script>
  <script src="./js/assessment-engine.js"></script>
  <script src="./js/qr.js"></script>
  <script src="./js/admin-app.js"></script>
</body>
</html>
