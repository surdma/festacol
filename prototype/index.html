<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Festacol dynamic student examination session">
  <title>Festacol · Examination Session</title>
  <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-dvh bg-neutral-100 font-sans text-black antialiased selection:bg-black selection:text-white">
  <a href="#app" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-xl focus:bg-black focus:px-4 focus:py-3 focus:text-sm focus:font-bold focus:text-white">Skip to examination</a>
  <div id="app" tabindex="-1" class="min-h-dvh outline-none" aria-live="polite">
    <main class="min-h-dvh bg-black text-white">
      <div class="mx-auto flex min-h-dvh max-w-7xl items-center justify-center p-6">
        <div class="max-w-md text-center">
          <span class="mx-auto grid size-14 place-items-center rounded-2xl bg-white text-lg font-black text-black">F</span>
          <p class="mt-8 text-xs font-bold uppercase tracking-widest text-neutral-500">Festacol examinations</p>
          <h1 class="mt-4 font-serif text-4xl font-bold">Resolving your session…</h1>
          <p class="mt-4 text-sm leading-7 text-neutral-400">Reading the exact examination configuration from this link.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
  <script src="./js/session-store.js"></script>
  <script src="./js/question-data.js"></script>
  <script src="./js/student-app.js"></script>
</body>
</html>
