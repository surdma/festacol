<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Festacol student and examination workspace">
  <title>Festacol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-sans: "DM Sans", sans-serif;
      --font-display: "Manrope", sans-serif;
      --animate-admin-enter: admin-enter 220ms cubic-bezier(.22,.61,.36,1) both;
      --animate-admin-pop: admin-pop 180ms cubic-bezier(.22,.61,.36,1) both;
      --animate-toast-in: toast-in 220ms cubic-bezier(.22,.61,.36,1) both;
    }
    @keyframes admin-enter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes admin-pop {
      from { opacity: 0; transform: scale(.985) translateY(4px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(10px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body class="min-h-dvh bg-neutral-50 font-sans text-neutral-950 antialiased">
  <a href="#app" class="fixed left-4 top-4 z-[200] -translate-y-24 rounded-xl bg-neutral-950 px-4 py-2.5 text-sm font-semibold text-white transition focus:translate-y-0 focus:outline-none focus:ring-4 focus:ring-neutral-300 motion-reduce:transition-none">Skip to application</a>
  <div id="app" tabindex="-1" class="min-h-dvh outline-none">
    <main class="grid min-h-dvh place-items-center p-6">
      <div class="rounded-2xl border border-neutral-200 bg-white p-7 text-center shadow-sm" role="status" aria-live="polite">
        <span class="mx-auto grid size-11 place-items-center rounded-xl bg-neutral-950 text-sm font-black text-white">F</span>
        <h1 class="mt-5 font-display text-2xl font-extrabold">Opening Festacol…</h1>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
  <script src="./js/shared.js"></script>
  <script>
    (() => {
      'use strict';
      const app = document.getElementById('app');
      const current = new URL(location.href);
      const requested = current.searchParams.get('route') || 'student';
      const knownRoutes = new Set(['student', 'admin', 'exam']);
      const route = knownRoutes.has(requested) ? requested : 'student';
      const runtimeByRoute = Object.freeze({
        student: './js/student.js',
        admin: './js/admin.js',
        exam: './js/exam.js'
      });

      if (!window.Festacol) {
        app.innerHTML = '<main class="grid min-h-dvh place-items-center p-6"><div class="max-w-lg rounded-2xl border border-red-200 bg-red-50 p-6 text-red-900"><h1 class="font-display text-xl font-extrabold">Festacol could not start.</h1><p class="mt-2 text-sm">The shared application runtime is unavailable.</p></div></main>';
        return;
      }

      if (route !== requested || !current.searchParams.has('route')) {
        current.searchParams.set('route', route);
        history.replaceState({}, '', current.href);
      }

      const metadata = Object.freeze({
        student: ['Festacol · Student Dashboard', 'Festacol student academic intelligence dashboard'],
        admin: ['Festacol · Administration', 'Festacol academic administration, examination and reporting workspace'],
        exam: ['Festacol · Examination', 'Festacol secure student computer-based examination workspace']
      })[route];
      document.title = metadata[0];
      document.querySelector('meta[name="description"]')?.setAttribute('content', metadata[1]);

      const installAdminDepthEnhancer = () => {
        const Festacol = window.Festacol;
        const Store = Festacol?.store;
        const Engine = Festacol?.assessment;
        const QR = Festacol?.qr;
        const utils = Festacol?.utils;
        if (!Store || !Engine || !utils) return;

        const esc = (value) => String(value ?? '')
          .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
        const formatDate = (value) => value ? new Date(value).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '—';
        const average = (values) => values.length ? Math.round(values.reduce((sum, value) => sum + Number(value || 0), 0) / values.length) : 0;
        const statusTone = (value) => value === 'active' || value === 'submitted' || value === 'open' ? 'bg-emerald-50 text-emerald-700 ring-emerald-600/20' : value === 'draft' || value === 'in progress' ? 'bg-amber-50 text-amber-700 ring-amber-600/20' : 'bg-neutral-100 text-neutral-700 ring-neutral-500/20';
        const badge = (value) => `<span class="inline-flex items-center rounded-full px-2.5 py-1 text-[11px] font-bold ring-1 ring-inset ${statusTone(String(value).toLowerCase())}">${esc(value)}</span>`;
        const paths = {
          school: 'M8 20v-9l-4 1.125V20h4Zm0 0h8m-8 0V6.66667M16 20v-9l4 1.125V20h-4Zm0 0V6.66667M18 8l-6-4-6 4m5 1h2m-2 3h2',
          users: 'M4.5 17H4a1 1 0 0 1-1-1 3 3 0 0 1 3-3h1m0-3.05A2.5 2.5 0 1 1 9 5.5M19.5 17h.5a1 1 0 0 0 1-1 3 3 0 0 0-3-3h-1m0-3.05a2.5 2.5 0 1 0-2-4.45m.5 13.5h-7a1 1 0 0 1-1-1 3 3 0 0 1 3-3h3a3 3 0 0 1 3 3 1 1 0 0 1-1 1Zm-1-9.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Z',
          chart: 'M4 19V9m5 10V5m5 14v-7m5 7V3',
          shield: 'M9.5 11.5 11 13l4-3.5M12 20a16.405 16.405 0 0 1-5.092-5.804A16.694 16.694 0 0 1 5 6.666L12 4l7 2.667a16.695 16.695 0 0 1-1.908 7.529A16.406 16.406 0 0 1 12 20Z',
          book: 'M6 4h8a4 4 0 0 1 4 4v12H8a2 2 0 0 1-2-2V4Zm0 0v13a3 3 0 0 1 3-3h9',
          qr: 'M4 4h6v6H4V4Zm10 10h6v6h-6v-6Zm0-10h6v6h-6V4Zm-4 10h.01v.01H10V14Zm0 4h.01v.01H10V18Zm-3 2h.01v.01H7V20Zm0-4h.01v.01H7V16Zm-3 2h.01v.01H4V18Zm0-4h.01v.01H4V14Z',
          external: 'M18 14v4.833A1.166 1.166 0 0 1 16.833 20H5.167A1.167 1.167 0 0 1 4 18.833V7.167A1.166 1.166 0 0 1 5.167 6h4.618m4.447-2H20v5.768m-7.889 2.121 7.778-7.778',
          arrow: 'M19 12H5m14 0-4 4m4-4-4-4'
        };
        const icon = (name, cls = 'size-4') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="${paths[name] || paths.chart}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
        const linkClass = 'inline-flex min-h-10 items-center justify-center gap-2 rounded-lg border border-neutral-300 bg-white px-3 py-2 text-sm font-semibold text-neutral-900 transition hover:-translate-y-px hover:border-neutral-400 hover:bg-neutral-100 hover:shadow-sm focus:outline-none focus:ring-4 focus:ring-neutral-200';
        const primaryClass = 'inline-flex min-h-10 items-center justify-center gap-2 rounded-lg bg-neutral-950 px-4 py-2 text-sm font-semibold text-white transition hover:-translate-y-px hover:bg-neutral-800 hover:shadow-md focus:outline-none focus:ring-4 focus:ring-neutral-300';
        const adminHref = (page, extra = {}) => utils.routeUrl('admin', { page, ...extra }, location.href);
        const currentParams = () => new URL(location.href).searchParams;
        const classes = () => Store.listClasses();
        const users = () => Store.listUsers();
        const students = () => users().filter((user) => user.role === 'student');
        const sessions = () => Store.listSessions();
        const attempts = () => Store.getAttempts();
        const groupForClass = (classId) => Store.whatsAppGroupForClass?.(classId) || Store.listWhatsAppGroups().find((group) => group.classId === classId) || null;
        const classForUser = (user) => classes().find((item) => item.id === user.classId) || null;
        const sessionForAttempt = (attempt) => Store.findSessionById(attempt.sessionId) || null;
        const classSessions = (cls) => sessions().filter((session) => session.classLevel === cls.classLevel && session.classGroup === cls.stream);
        const userAttempts = async (user) => {
          const hash = await Engine.studentHash(user.firstName, user.lastName);
          return Store.attemptsForStudent(hash).slice().sort((a, b) => (b.submittedAt || b.startedAt || 0) - (a.submittedAt || a.startedAt || 0));
        };
        const subjectScores = (attemptList) => {
          const buckets = new Map();
          attemptList.filter((attempt) => attempt.submittedAt && !attempt.rewriteArchivedAt).forEach((attempt) => {
            Object.entries(attempt.subjectStats || {}).forEach(([code, value]) => {
              const total = Number(value?.total ?? value?.count ?? 0);
              const correct = Number(value?.correct ?? 0);
              const explicit = Number(value?.percentage ?? value?.score);
              const score = Number.isFinite(explicit) ? explicit : total > 0 ? Math.round((correct / total) * 100) : 0;
              if (!buckets.has(code)) buckets.set(code, []);
              buckets.get(code).push(score);
            });
          });
          return [...buckets.entries()].map(([code, values]) => ({ code, score: average(values) })).sort((a, b) => b.score - a.score);
        };
        const metric = (label, value, detail, glyph = 'chart') => `<div class="group rounded-2xl border border-neutral-200 bg-white p-4 shadow-sm transition hover:-translate-y-0.5 hover:border-neutral-300 hover:shadow-md"><div class="flex items-start justify-between gap-4"><span class="grid size-9 place-items-center rounded-xl bg-neutral-950 text-white">${icon(glyph)}</span><span class="text-[10px] font-bold uppercase tracking-[.14em] text-neutral-400">Live data</span></div><strong class="mt-5 block font-display text-2xl font-extrabold tracking-tight">${esc(value)}</strong><span class="mt-1 block text-xs font-semibold text-neutral-700">${esc(label)}</span><p class="mt-2 text-[11px] leading-5 text-neutral-500">${esc(detail)}</p></div>`;
        const sectionHeader = (eyebrow, title, detail, action = '') => `<div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between"><div><p class="text-[10px] font-bold uppercase tracking-[.16em] text-neutral-400">${esc(eyebrow)}</p><h2 class="mt-1 font-display text-xl font-extrabold tracking-tight sm:text-2xl">${esc(title)}</h2><p class="mt-1 max-w-3xl text-sm leading-6 text-neutral-500">${esc(detail)}</p></div>${action}</div>`;
        const empty = (text) => `<div class="rounded-2xl border border-dashed border-neutral-300 bg-neutral-50 p-6 text-sm text-neutral-500">${esc(text)}</div>`;

        const chart = (selector, options) => {
          if (!window.ApexCharts) return;
          const host = document.querySelector(selector);
          if (!host || host.dataset.chartMounted === 'true') return;
          host.dataset.chartMounted = 'true';
          new window.ApexCharts(host, {
            chart: { toolbar: { show: false }, animations: { enabled: !matchMedia('(prefers-reduced-motion: reduce)').matches }, fontFamily: 'DM Sans, sans-serif', foreColor: '#525252', ...options.chart },
            colors: ['#171717', '#737373', '#a3a3a3', '#d4d4d4'],
            dataLabels: { enabled: false },
            grid: { borderColor: '#e5e5e5', strokeDashArray: 4 },
            tooltip: { theme: 'light' },
            ...options
          }).render();
        };

        const renderStudentRecord = async (root, studentId) => {
          const user = students().find((item) => item.id === studentId);
          if (!user) return;
          const cls = classForUser(user);
          const group = cls ? groupForClass(cls.id) : null;
          const allAttempts = await userAttempts(user);
          const activeAttempts = allAttempts.filter((attempt) => !attempt.rewriteArchivedAt);
          const submitted = activeAttempts.filter((attempt) => attempt.submittedAt);
          const scores = submitted.map((attempt) => Number(attempt.score ?? 0));
          const integrity = submitted.map((attempt) => Number(attempt.integrityScore ?? 100));
          const subjects = subjectScores(submitted);
          const latestPlacement = submitted.map((attempt) => attempt.placement).filter(Boolean)[0] || null;
          root.innerHTML = `<div data-admin-depth-enhanced="student-record" class="space-y-6 animate-admin-enter">
            <div class="flex flex-col gap-4 rounded-3xl border border-neutral-200 bg-neutral-950 p-5 text-white shadow-xl sm:p-7 lg:flex-row lg:items-end lg:justify-between">
              <div class="min-w-0"><a href="${adminHref('students')}" data-admin-link class="inline-flex items-center gap-2 text-xs font-bold text-neutral-400 transition hover:text-white">← Student directory</a><p class="mt-5 text-[10px] font-bold uppercase tracking-[.18em] text-neutral-500">Academic student record</p><h1 class="mt-2 truncate font-display text-3xl font-extrabold sm:text-4xl">${esc(user.fullName)}</h1><p class="mt-2 text-sm text-neutral-400">${esc(cls?.name || 'No class assigned')} · ${esc(user.guardian || 'Guardian not recorded')} · ${esc(user.status || 'active')}</p></div>
              <div class="flex flex-wrap gap-2"><button class="${linkClass} border-neutral-700 bg-neutral-900 text-white hover:bg-neutral-800" data-user-edit="${esc(user.id)}">Edit student</button>${cls ? `<a href="${adminHref('classes', { view: 'record', class: cls.id })}" data-admin-link class="${linkClass} border-neutral-700 bg-neutral-900 text-white hover:bg-neutral-800">${icon('school')}Open class</a>` : ''}<a href="${adminHref('reports', { view: 'student', student: user.id })}" data-admin-link class="${primaryClass} bg-white text-neutral-950 hover:bg-neutral-100">${icon('chart')}Student report</a></div>
            </div>
            <div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-6">
              ${metric('Current class', cls?.name || 'Unassigned', cls ? `${cls.classLevel} · ${cls.stream}` : 'Assign a class to connect cohort analytics.', 'school')}
              ${metric('Exam attempts', activeAttempts.length, `${submitted.length} submitted · ${activeAttempts.filter((a) => !a.submittedAt).length} in progress`, 'book')}
              ${metric('Average score', submitted.length ? `${average(scores)}%` : '—', submitted.length ? 'Across submitted current attempts.' : 'No submitted exam yet.', 'chart')}
              ${metric('Integrity average', submitted.length ? `${average(integrity)}%` : '—', `${submitted.reduce((n, a) => n + (a.integrityEvents?.length || 0), 0)} integrity event(s) recorded.`, 'shield')}
              ${metric('Placement', latestPlacement?.track || latestPlacement?.pathway || '—', latestPlacement ? (latestPlacement.status || 'Latest placement outcome') : 'No placement result recorded.', 'school')}
              ${metric('Parent group', group ? 'Connected' : 'Missing', group ? group.name : 'No WhatsApp group linked to the class.', 'qr')}
            </div>
            <div class="grid gap-5 xl:grid-cols-[1.35fr_.85fr]">
              <section class="rounded-3xl border border-neutral-200 bg-white p-5 shadow-sm sm:p-6">${sectionHeader('Performance trajectory', 'Exam score history', 'Each point is a stored submitted examination attempt for this student.')}<div id="student-score-chart" class="mt-4 min-h-72"></div></section>
              <section class="rounded-3xl border border-neutral-200 bg-white p-5 shadow-sm sm:p-6">${sectionHeader('Subject intelligence', 'Subject performance', 'Average subject score across the student’s submitted attempts.')}<div id="student-subject-chart" class="mt-4 min-h-72"></div></section>
            </div>
            <div class="grid gap-5 xl:grid-cols-[1.4fr_.6fr]">
              <section class="overflow-hidden rounded-3xl border border-neutral-200 bg-white shadow-sm"><div class="p-5 sm:p-6">${sectionHeader('Traceable history', 'Examinations & individual attempts', 'Open any row to inspect the exact score, integrity record, rewrite history and exam source. Pruned or previous attempts remain visibly distinct.')}</div><div class="overflow-x-auto"><table class="w-full min-w-[760px] text-left text-sm"><thead class="border-y border-neutral-200 bg-neutral-50 text-[10px] font-bold uppercase tracking-[.12em] text-neutral-500"><tr><th class="px-5 py-3">Exam</th><th class="px-5 py-3">Class</th><th class="px-5 py-3">Status</th><th class="px-5 py-3">Score</th><th class="px-5 py-3">Integrity</th><th class="px-5 py-3">Events</th><th class="px-5 py-3"></th></tr></thead><tbody class="divide-y divide-neutral-100">${allAttempts.length ? allAttempts.map((attempt) => { const session = sessionForAttempt(attempt); return `<tr class="transition hover:bg-neutral-50 ${attempt.rewriteArchivedAt ? 'opacity-65' : ''}"><td class="px-5 py-4"><strong class="block text-neutral-950">${esc(attempt.sessionTitle || session?.title || attempt.sessionId)}</strong><span class="mt-1 block text-xs text-neutral-500">${esc(attempt.sessionId)} · ${esc(formatDate(attempt.submittedAt || attempt.startedAt))}</span></td><td class="px-5 py-4 text-neutral-600">${esc(session ? `${session.classLevel} · ${session.classGroup}` : 'Historical')}</td><td class="px-5 py-4">${badge(attempt.rewriteArchivedAt ? 'Previous' : attempt.submittedAt ? 'Submitted' : 'In progress')}</td><td class="px-5 py-4 font-bold">${attempt.submittedAt ? `${esc(attempt.score ?? 0)}%` : '—'}</td><td class="px-5 py-4 font-bold">${esc(attempt.integrityScore ?? 100)}%</td><td class="px-5 py-4">${attempt.integrityEvents?.length || 0}</td><td class="px-5 py-4"><button class="${linkClass}" data-attempt-detail="${esc(attempt.attemptHash)}">Audit</button></td></tr>`; }).join('') : `<tr><td colspan="7" class="px-5 py-8 text-center text-neutral-500">No exam history for this student yet.</td></tr>`}</tbody></table></div></section>
              <div class="space-y-5"><section class="rounded-3xl border border-neutral-200 bg-white p-5 shadow-sm sm:p-6">${sectionHeader('Class relationship', 'Academic placement', 'The student record stays linked to the current class, stream and parent communication group.')}<dl class="mt-5 grid gap-4 text-sm"><div><dt class="text-xs font-semibold text-neutral-500">Class</dt><dd class="mt-1 font-bold">${esc(cls?.name || 'Unassigned')}</dd></div><div><dt class="text-xs font-semibold text-neutral-500">Pathway / stream</dt><dd class="mt-1 font-bold">${esc(cls?.stream || '—')}</dd></div><div><dt class="text-xs font-semibold text-neutral-500">Room</dt><dd class="mt-1 font-bold">${esc(cls?.room || '—')}</dd></div></dl>${cls ? `<a href="${adminHref('classes', { view: 'record', class: cls.id })}" data-admin-link class="${primaryClass} mt-5 w-full">Open class record ${icon('arrow')}</a>` : ''}</section>
                <section class="rounded-3xl border border-neutral-200 bg-white p-5 shadow-sm sm:p-6">${sectionHeader('Communication', 'Parent WhatsApp', 'Communication is owned by the student’s assigned class.')}${group ? `<div class="mt-5 rounded-2xl bg-neutral-50 p-4"><strong class="text-sm">${esc(group.name)}</strong><p class="mt-1 text-xs text-neutral-500">Linked through ${esc(cls?.name || 'class')}</p><div id="student-group-qr" class="mx-auto mt-4 max-w-36 rounded-xl bg-white p-2"></div><a href="${esc(group.inviteUrl)}" target="_blank" rel="noopener noreferrer" class="${linkClass} mt-4 w-full">${icon('external')}Open group</a></div>` : `<div class="mt-5">${empty('No WhatsApp group is associated with this student’s class yet.')}</div>`}</section></div>
            </div>
          </div>`;
          chart('#student-score-chart', { chart: { type: 'area', height: 285 }, series: [{ name: 'Score', data: submitted.slice().reverse().map((attempt) => Number(attempt.score ?? 0)) }], xaxis: { categories: submitted.slice().reverse().map((attempt) => attempt.sessionTitle || attempt.sessionId), labels: { rotate: -35 } }, yaxis: { min: 0, max: 100, tickAmount: 5, labels: { formatter: (value) => `${Math.round(value)}%` } }, stroke: { curve: 'smooth', width: 3 }, fill: { opacity: .12 } });
          chart('#student-subject-chart', { chart: { type: 'bar', height: 285 }, series: [{ name: 'Average', data: subjects.slice(0, 8).map((item) => item.score) }], xaxis: { categories: subjects.slice(0, 8).map((item) => item.code) }, yaxis: { min: 0, max: 100, labels: { formatter: (value) => `${Math.round(value)}%` } }, plotOptions: { bar: { borderRadius: 5, columnWidth: '55%' } } });
          if (group) queueMicrotask(() => { const host = document.getElementById('student-group-qr'); if (host) QR?.render(host, group.inviteUrl); });
        };

        const renderClassRecord = async (root, classId) => {
          const cls = classes().find((item) => item.id === classId);
          if (!cls) return;
          const classStudents = students().filter((student) => student.classId === cls.id);
          const group = groupForClass(cls.id);
          const matchedSessions = classSessions(cls);
          const sessionIds = new Set(matchedSessions.map((session) => session.id));
          const perStudent = await Promise.all(classStudents.map(async (student) => ({ student, attempts: (await userAttempts(student)).filter((attempt) => sessionIds.has(attempt.sessionId)) })));
          const classAttempts = perStudent.flatMap((item) => item.attempts);
          const currentAttempts = classAttempts.filter((attempt) => !attempt.rewriteArchivedAt);
          const submitted = currentAttempts.filter((attempt) => attempt.submittedAt);
          const scoreValues = submitted.map((attempt) => Number(attempt.score ?? 0));
          const integrityValues = submitted.map((attempt) => Number(attempt.integrityScore ?? 100));
          const capacity = Number(cls.capacity || 0);
          const occupancy = capacity ? Math.min(100, Math.round((classStudents.filter((student) => student.status === 'active').length / capacity) * 100)) : 0;
          const examAverages = matchedSessions.map((session) => { const rows = submitted.filter((attempt) => attempt.sessionId === session.id); return { title: session.title, score: average(rows.map((attempt) => attempt.score)), attempts: rows.length }; }).filter((item) => item.attempts);
          root.innerHTML = `<div data-admin-depth-enhanced="class-record" class="space-y-6 animate-admin-enter">
            <div class="rounded-3xl border border-neutral-200 bg-white p-5 shadow-sm sm:p-7"><a href="${adminHref('classes')}" data-admin-link class="inline-flex items-center gap-2 text-xs font-bold text-neutral-500 transition hover:text-black">← All classes</a><div class="mt-5 flex flex-col gap-5 lg:flex-row lg:items-end lg:justify-between"><div><p class="text-[10px] font-bold uppercase tracking-[.18em] text-neutral-400">Academic class record</p><h1 class="mt-2 font-display text-3xl font-extrabold tracking-tight sm:text-4xl">${esc(cls.name)}</h1><p class="mt-2 text-sm text-neutral-500">${esc(cls.classLevel)} · ${esc(cls.stream)} · ${esc(cls.room || 'Room not assigned')} · ${esc(cls.status || 'active')}</p></div><div class="flex flex-wrap gap-2"><button class="${linkClass}" data-class-edit="${esc(cls.id)}">Edit class</button>${group ? `<button class="${linkClass}" data-whatsapp-edit="${esc(group.id)}">${icon('qr')}Manage WhatsApp</button>` : `<button class="${linkClass}" data-whatsapp-for-class="${esc(cls.id)}">${icon('qr')}Add WhatsApp</button>`}<a href="${adminHref('reports', { view: 'class', class: cls.id })}" data-admin-link class="${primaryClass}">${icon('chart')}Class report</a></div></div></div>
            <div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-6">${metric('Students', classStudents.length, `${classStudents.filter((student) => student.status === 'active').length} active records`, 'users')}${metric('Capacity', capacity || '—', capacity ? `${occupancy}% occupied` : 'No capacity configured', 'school')}${metric('Matched exams', matchedSessions.length, 'Matched by class level + pathway/stream.', 'book')}${metric('Submitted attempts', submitted.length, `${currentAttempts.filter((attempt) => !attempt.submittedAt).length} currently unfinished`, 'chart')}${metric('Class average', submitted.length ? `${average(scoreValues)}%` : '—', 'Across exact student + class-matched attempts.', 'chart')}${metric('Integrity', submitted.length ? `${average(integrityValues)}%` : '—', `${submitted.reduce((n, attempt) => n + (attempt.integrityEvents?.length || 0), 0)} event(s)`, 'shield')}</div>
            <div class="grid gap-5 xl:grid-cols-[1.2fr_.8fr]"><section class="rounded-3xl border border-neutral-200 bg-white p-5 shadow-sm sm:p-6">${sectionHeader('Cohort analytics', 'Assessment performance by exam', 'Only attempts belonging to students currently assigned to this class and examinations targeting this level/pathway are included.')}<div id="class-performance-chart" class="mt-4 min-h-72"></div></section><section class="rounded-3xl border border-neutral-200 bg-neutral-950 p-5 text-white shadow-xl sm:p-6">${sectionHeader('Communication', 'Class WhatsApp', 'The parent group is a first-class part of the class record, not a detached settings item.')}${group ? `<div class="mt-5 grid gap-4 sm:grid-cols-[1fr_150px] sm:items-center"><div><strong class="font-display text-xl">${esc(group.name)}</strong><p class="mt-2 text-sm leading-6 text-neutral-400">QR and invite remain attached to ${esc(cls.name)}.</p><a href="${esc(group.inviteUrl)}" target="_blank" rel="noopener noreferrer" class="${linkClass} mt-4 border-neutral-700 bg-neutral-900 text-white hover:bg-neutral-800">${icon('external')}Open group</a></div><div id="class-group-qr" class="rounded-2xl bg-white p-3"></div></div>` : `<div class="mt-5 rounded-2xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-sm text-neutral-300">No WhatsApp parent group is linked yet.</p><button class="${primaryClass} mt-4 bg-white text-neutral-950 hover:bg-neutral-100" data-whatsapp-for-class="${esc(cls.id)}">${icon('qr')}Add group</button></div>`}</section></div>
            <section class="overflow-hidden rounded-3xl border border-neutral-200 bg-white shadow-sm"><div class="p-5 sm:p-6">${sectionHeader('Student roster', 'Students, performance & integrity', 'Every student row links back to the individual academic record and carries its class-scoped exam evidence.')}</div><div class="overflow-x-auto"><table class="w-full min-w-[820px] text-left text-sm"><thead class="border-y border-neutral-200 bg-neutral-50 text-[10px] font-bold uppercase tracking-[.12em] text-neutral-500"><tr><th class="px-5 py-3">Student</th><th class="px-5 py-3">Status</th><th class="px-5 py-3">Attempts</th><th class="px-5 py-3">Average</th><th class="px-5 py-3">Integrity</th><th class="px-5 py-3">Last activity</th><th class="px-5 py-3"></th></tr></thead><tbody class="divide-y divide-neutral-100">${perStudent.length ? perStudent.map(({ student, attempts: rows }) => { const clean = rows.filter((attempt) => !attempt.rewriteArchivedAt); const done = clean.filter((attempt) => attempt.submittedAt); return `<tr class="transition hover:bg-neutral-50"><td class="px-5 py-4"><strong class="block">${esc(student.fullName)}</strong><span class="mt-1 block text-xs text-neutral-500">${esc(student.guardian || 'No guardian record')}</span></td><td class="px-5 py-4">${badge(student.status || 'active')}</td><td class="px-5 py-4 font-semibold">${clean.length}</td><td class="px-5 py-4 font-bold">${done.length ? `${average(done.map((attempt) => attempt.score))}%` : '—'}</td><td class="px-5 py-4 font-bold">${done.length ? `${average(done.map((attempt) => attempt.integrityScore ?? 100))}%` : '—'}</td><td class="px-5 py-4 text-xs text-neutral-500">${esc(formatDate(clean[0]?.submittedAt || clean[0]?.startedAt))}</td><td class="px-5 py-4"><a href="${adminHref('students', { view: 'record', student: student.id })}" data-admin-link class="${linkClass}">Record ${icon('arrow')}</a></td></tr>`; }).join('') : `<tr><td colspan="7" class="px-5 py-8 text-center text-neutral-500">No students are assigned to this class.</td></tr>`}</tbody></table></div></section>
            <section class="rounded-3xl border border-neutral-200 bg-white p-5 shadow-sm sm:p-6">${sectionHeader('Exam lineage', 'Class examinations', 'These sessions resolve to the class through the stored class level and pathway/stream relationship.')}<div class="mt-5 grid gap-3 lg:grid-cols-2">${matchedSessions.length ? matchedSessions.map((session) => { const rows = submitted.filter((attempt) => attempt.sessionId === session.id); return `<button data-exam-detail="${esc(session.id)}" class="group flex w-full items-center gap-4 rounded-2xl border border-neutral-200 p-4 text-left transition hover:-translate-y-px hover:border-neutral-300 hover:shadow-md"><span class="grid size-11 shrink-0 place-items-center rounded-xl bg-neutral-950 text-white">${icon('book')}</span><span class="min-w-0 flex-1"><strong class="block truncate">${esc(session.title)}</strong><span class="mt-1 block text-xs text-neutral-500">${esc(session.id)} · ${rows.length} submitted · ${rows.length ? `${average(rows.map((attempt) => attempt.score))}% avg` : 'No results yet'}</span></span>${icon('arrow', 'size-4 text-neutral-400 transition group-hover:translate-x-1')}</button>`; }).join('') : empty('No examinations currently target this class audience.')}</div></section>
          </div>`;
          chart('#class-performance-chart', { chart: { type: 'bar', height: 285 }, series: [{ name: 'Class average', data: examAverages.map((item) => item.score) }], xaxis: { categories: examAverages.map((item) => item.title), labels: { rotate: -30 } }, yaxis: { min: 0, max: 100, labels: { formatter: (value) => `${Math.round(value)}%` } }, plotOptions: { bar: { borderRadius: 6, columnWidth: '50%' } } });
          if (group) queueMicrotask(() => { const host = document.getElementById('class-group-qr'); if (host) QR?.render(host, group.inviteUrl); });
        };

        const appendStudentDepth = async (root) => {
          if (root.querySelector('[data-admin-depth-panel="students"]')) return;
          const rows = await Promise.all(students().slice(0, 18).map(async (student) => {
            const cls = classForUser(student);
            const records = (await userAttempts(student)).filter((attempt) => !attempt.rewriteArchivedAt);
            const done = records.filter((attempt) => attempt.submittedAt);
            return { student, cls, records, done };
          }));
          const classBuckets = classes().map((cls) => ({ name: cls.name, count: students().filter((student) => student.classId === cls.id).length })).filter((item) => item.count);
          root.insertAdjacentHTML('beforeend', `<section data-admin-depth-panel="students" class="mt-6 space-y-5 rounded-3xl border border-neutral-200 bg-white p-5 shadow-sm animate-admin-enter sm:p-6">${sectionHeader('Connected academic records', 'Student intelligence workspace', 'The directory now exposes class, examination, attempt, score and integrity relationships instead of treating students as isolated identities.')}<div class="grid gap-5 xl:grid-cols-[.72fr_1.28fr]"><div class="rounded-2xl border border-neutral-200 bg-neutral-50 p-4"><h3 class="font-display text-base font-extrabold">Students by class</h3><p class="mt-1 text-xs text-neutral-500">Current class assignment coverage.</p><div id="students-class-chart" class="mt-4 min-h-64"></div></div><div class="overflow-hidden rounded-2xl border border-neutral-200"><div class="border-b border-neutral-200 bg-neutral-50 px-4 py-3"><strong class="text-sm">Academic snapshots</strong></div><div class="overflow-x-auto"><table class="w-full min-w-[700px] text-left text-sm"><thead class="text-[10px] font-bold uppercase tracking-[.12em] text-neutral-500"><tr><th class="px-4 py-3">Student</th><th class="px-4 py-3">Class</th><th class="px-4 py-3">Attempts</th><th class="px-4 py-3">Average</th><th class="px-4 py-3">Integrity</th><th class="px-4 py-3"></th></tr></thead><tbody class="divide-y divide-neutral-100">${rows.length ? rows.map(({ student, cls, records, done }) => `<tr class="transition hover:bg-neutral-50"><td class="px-4 py-3"><strong>${esc(student.fullName)}</strong><span class="mt-1 block text-xs text-neutral-500">${esc(student.status || 'active')}</span></td><td class="px-4 py-3">${cls ? `<a href="${adminHref('classes', { view: 'record', class: cls.id })}" data-admin-link class="font-semibold underline decoration-neutral-300 underline-offset-4 hover:decoration-black">${esc(cls.name)}</a>` : '<span class="text-neutral-400">Unassigned</span>'}</td><td class="px-4 py-3 font-semibold">${records.length}</td><td class="px-4 py-3 font-bold">${done.length ? `${average(done.map((attempt) => attempt.score))}%` : '—'}</td><td class="px-4 py-3 font-bold">${done.length ? `${average(done.map((attempt) => attempt.integrityScore ?? 100))}%` : '—'}</td><td class="px-4 py-3"><a href="${adminHref('students', { view: 'record', student: student.id })}" data-admin-link class="${linkClass}">Academic record ${icon('arrow')}</a></td></tr>`).join('') : `<tr><td colspan="6" class="px-4 py-8 text-center text-neutral-500">No student records yet.</td></tr>`}</tbody></table></div></div></div></section>`);
          chart('#students-class-chart', { chart: { type: 'donut', height: 255 }, series: classBuckets.map((item) => item.count), labels: classBuckets.map((item) => item.name), legend: { position: 'bottom' }, stroke: { width: 2, colors: ['#fff'] } });
        };

        const appendClassDepth = async (root) => {
          if (root.querySelector('[data-admin-depth-panel="classes"]')) return;
          const classRows = await Promise.all(classes().map(async (cls) => {
            const classStudents = students().filter((student) => student.classId === cls.id);
            const matched = classSessions(cls);
            const sessionIds = new Set(matched.map((session) => session.id));
            const studentAttempts = await Promise.all(classStudents.map(async (student) => (await userAttempts(student)).filter((attempt) => sessionIds.has(attempt.sessionId) && !attempt.rewriteArchivedAt)));
            const submitted = studentAttempts.flat().filter((attempt) => attempt.submittedAt);
            return { cls, classStudents, matched, submitted, group: groupForClass(cls.id) };
          }));
          root.insertAdjacentHTML('beforeend', `<section data-admin-depth-panel="classes" class="mt-6 space-y-5 animate-admin-enter">${sectionHeader('Academic structure', 'Class operations matrix', 'Classes now own students, parent WhatsApp communication, targeted examinations, performance and integrity evidence in one connected record.')}<div class="overflow-hidden rounded-3xl border border-neutral-200 bg-white shadow-sm"><div class="overflow-x-auto"><table class="w-full min-w-[940px] text-left text-sm"><thead class="border-b border-neutral-200 bg-neutral-950 text-[10px] font-bold uppercase tracking-[.12em] text-neutral-300"><tr><th class="px-5 py-4">Class</th><th class="px-5 py-4">Students</th><th class="px-5 py-4">Capacity</th><th class="px-5 py-4">WhatsApp</th><th class="px-5 py-4">Exams</th><th class="px-5 py-4">Submissions</th><th class="px-5 py-4">Average</th><th class="px-5 py-4">Integrity</th><th class="px-5 py-4"></th></tr></thead><tbody class="divide-y divide-neutral-100">${classRows.length ? classRows.map(({ cls, classStudents, matched, submitted, group }) => `<tr class="transition hover:bg-neutral-50"><td class="px-5 py-4"><strong class="block">${esc(cls.name)}</strong><span class="mt-1 block text-xs text-neutral-500">${esc(cls.classLevel)} · ${esc(cls.stream)} · ${esc(cls.room || 'No room')}</span></td><td class="px-5 py-4 font-bold">${classStudents.length}</td><td class="px-5 py-4">${esc(cls.capacity || '—')}</td><td class="px-5 py-4">${group ? badge('Connected') : badge('Missing')}</td><td class="px-5 py-4 font-semibold">${matched.length}</td><td class="px-5 py-4 font-semibold">${submitted.length}</td><td class="px-5 py-4 font-bold">${submitted.length ? `${average(submitted.map((attempt) => attempt.score))}%` : '—'}</td><td class="px-5 py-4 font-bold">${submitted.length ? `${average(submitted.map((attempt) => attempt.integrityScore ?? 100))}%` : '—'}</td><td class="px-5 py-4"><a href="${adminHref('classes', { view: 'record', class: cls.id })}" data-admin-link class="${primaryClass}">Open record ${icon('arrow')}</a></td></tr>`).join('') : `<tr><td colspan="9" class="px-5 py-8 text-center text-neutral-500">Create a class to begin connected academic operations.</td></tr>`}</tbody></table></div></div></section>`);
        };

        const appendReportsDepth = async (root) => {
          if (root.querySelector('[data-admin-depth-panel="reports"]')) return;
          const classData = await Promise.all(classes().map(async (cls) => {
            const classStudents = students().filter((student) => student.classId === cls.id);
            const matched = classSessions(cls);
            const sessionIds = new Set(matched.map((session) => session.id));
            const rows = (await Promise.all(classStudents.map(async (student) => (await userAttempts(student)).filter((attempt) => sessionIds.has(attempt.sessionId) && attempt.submittedAt && !attempt.rewriteArchivedAt)))).flat();
            return { cls, rows, score: average(rows.map((attempt) => attempt.score)), integrity: average(rows.map((attempt) => attempt.integrityScore ?? 100)) };
          }));
          const submitted = attempts().filter((attempt) => attempt.submittedAt && !attempt.rewriteArchivedAt);
          const examData = sessions().map((session) => { const rows = submitted.filter((attempt) => attempt.sessionId === session.id); return { session, rows, average: average(rows.map((attempt) => attempt.score)) }; }).filter((item) => item.rows.length).sort((a, b) => b.rows.length - a.rows.length).slice(0, 8);
          const eventCounts = new Map();
          submitted.forEach((attempt) => (attempt.integrityEvents || []).forEach((event) => eventCounts.set(event.type, (eventCounts.get(event.type) || 0) + 1)));
          const integrityData = [...eventCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8);
          root.insertAdjacentHTML('beforeend', `<section data-admin-depth-panel="reports" class="mt-6 space-y-5 animate-admin-enter">${sectionHeader('Relationship analytics', 'Connected academic intelligence', 'Reports now resolve back to classes, students, examinations, exact attempts and integrity evidence instead of presenting disconnected totals.')}<div class="grid gap-5 xl:grid-cols-3"><div class="rounded-3xl border border-neutral-200 bg-white p-5 shadow-sm"><h3 class="font-display text-base font-extrabold">Class performance</h3><p class="mt-1 text-xs text-neutral-500">Average score by current class relationship.</p><div id="reports-class-chart" class="mt-4 min-h-64"></div></div><div class="rounded-3xl border border-neutral-200 bg-white p-5 shadow-sm"><h3 class="font-display text-base font-extrabold">Exam performance</h3><p class="mt-1 text-xs text-neutral-500">Average score by stored examination.</p><div id="reports-exam-chart" class="mt-4 min-h-64"></div></div><div class="rounded-3xl border border-neutral-200 bg-white p-5 shadow-sm"><h3 class="font-display text-base font-extrabold">Integrity event profile</h3><p class="mt-1 text-xs text-neutral-500">Recorded proctor event categories.</p><div id="reports-integrity-chart" class="mt-4 min-h-64"></div></div></div><div class="grid gap-5 xl:grid-cols-[1.15fr_.85fr]"><div class="overflow-hidden rounded-3xl border border-neutral-200 bg-white shadow-sm"><div class="p-5">${sectionHeader('Class lineage', 'Class report sources', 'Every row opens the underlying class record where students, parent group, exams and attempts are connected.')}</div><div class="overflow-x-auto"><table class="w-full min-w-[680px] text-left text-sm"><thead class="border-y border-neutral-200 bg-neutral-50 text-[10px] font-bold uppercase tracking-[.12em] text-neutral-500"><tr><th class="px-5 py-3">Class</th><th class="px-5 py-3">Submissions</th><th class="px-5 py-3">Average</th><th class="px-5 py-3">Integrity</th><th class="px-5 py-3"></th></tr></thead><tbody class="divide-y divide-neutral-100">${classData.map(({ cls, rows, score, integrity }) => `<tr class="hover:bg-neutral-50"><td class="px-5 py-4"><strong>${esc(cls.name)}</strong><span class="mt-1 block text-xs text-neutral-500">${esc(cls.classLevel)} · ${esc(cls.stream)}</span></td><td class="px-5 py-4 font-semibold">${rows.length}</td><td class="px-5 py-4 font-bold">${rows.length ? `${score}%` : '—'}</td><td class="px-5 py-4 font-bold">${rows.length ? `${integrity}%` : '—'}</td><td class="px-5 py-4"><a href="${adminHref('classes', { view: 'record', class: cls.id })}" data-admin-link class="${linkClass}">Source ${icon('arrow')}</a></td></tr>`).join('')}</tbody></table></div></div><div class="rounded-3xl border border-neutral-200 bg-neutral-950 p-5 text-white shadow-xl sm:p-6"><p class="text-[10px] font-bold uppercase tracking-[.16em] text-neutral-500">Audit graph</p><h3 class="mt-1 font-display text-xl font-extrabold">End-to-end record chain</h3><p class="mt-2 text-sm leading-6 text-neutral-400">Admin reporting follows the same stored relationships used by operations.</p><div class="mt-6 grid gap-2 text-sm">${['Student identity → current Class','Class → WhatsApp parent group','Class audience → Examinations','Student + Examination → exact Attempt','Attempt → Score + Subject performance','Attempt → Integrity event log','Qualifier Attempt → Placement outcome'].map((text, index) => `<div class="flex items-center gap-3 rounded-xl border border-neutral-800 bg-neutral-900 p-3"><span class="grid size-7 shrink-0 place-items-center rounded-lg bg-white text-xs font-black text-black">${index + 1}</span><span class="text-neutral-200">${esc(text)}</span></div>`).join('')}</div></div></div></section>`);
          chart('#reports-class-chart', { chart: { type: 'bar', height: 260 }, series: [{ name: 'Average', data: classData.map((item) => item.score) }], xaxis: { categories: classData.map((item) => item.cls.name), labels: { rotate: -35 } }, yaxis: { min: 0, max: 100, labels: { formatter: (value) => `${Math.round(value)}%` } }, plotOptions: { bar: { borderRadius: 5 } } });
          chart('#reports-exam-chart', { chart: { type: 'area', height: 260 }, series: [{ name: 'Average', data: examData.map((item) => item.average) }], xaxis: { categories: examData.map((item) => item.session.title), labels: { rotate: -35 } }, yaxis: { min: 0, max: 100, labels: { formatter: (value) => `${Math.round(value)}%` } }, stroke: { curve: 'smooth', width: 3 }, fill: { opacity: .1 } });
          chart('#reports-integrity-chart', { chart: { type: 'donut', height: 260 }, series: integrityData.map((item) => item[1]), labels: integrityData.map((item) => item[0]), legend: { position: 'bottom' } });
        };

        let enhancing = false;
        const enhance = async () => {
          if (enhancing) return;
          const root = document.getElementById('admin-root');
          if (!root) return;
          const query = currentParams();
          const page = query.get('page') || 'overview';
          enhancing = true;
          try {
            if (page === 'students' && query.get('view') === 'record' && query.get('student')) await renderStudentRecord(root, query.get('student'));
            else if (page === 'classes' && query.get('view') === 'record' && query.get('class')) await renderClassRecord(root, query.get('class'));
            else if (page === 'students') await appendStudentDepth(root);
            else if (page === 'classes') await appendClassDepth(root);
            else if (page === 'reports') await appendReportsDepth(root);
          } finally {
            enhancing = false;
          }
        };

        const attach = () => {
          const root = document.getElementById('admin-root');
          if (!root) { requestAnimationFrame(attach); return; }
          let scheduled = false;
          const observer = new MutationObserver(() => {
            if (scheduled) return;
            scheduled = true;
            queueMicrotask(async () => { scheduled = false; await enhance(); });
          });
          observer.observe(root, { childList: true });
          window.addEventListener('popstate', () => queueMicrotask(enhance));
          enhance();
        };
        attach();
      };

      const script = document.createElement('script');
      script.src = runtimeByRoute[route];
      script.addEventListener('error', () => {
        const label = route === 'exam' ? 'Examination' : route === 'admin' ? 'Administration' : 'Student workspace';
        app.innerHTML = `<main class="grid min-h-dvh place-items-center p-6"><div class="max-w-lg rounded-2xl border border-red-200 bg-red-50 p-6 text-red-900"><h1 class="font-display text-xl font-extrabold">${label} unavailable.</h1><p class="mt-2 text-sm">The selected Festacol runtime could not be loaded.</p></div></main>`;
      });
      if (route === 'admin') {
        script.addEventListener('load', () => {
          const charts = document.createElement('script');
          charts.src = 'https://cdn.jsdelivr.net/npm/apexcharts@3.46.0';
          charts.defer = true;
          charts.addEventListener('load', installAdminDepthEnhancer, { once: true });
          charts.addEventListener('error', installAdminDepthEnhancer, { once: true });
          document.head.append(charts);
        }, { once: true });
      }
      document.body.append(script);
    })();
  </script>
</body>
</html>
