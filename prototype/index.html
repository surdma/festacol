<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Festacol dynamic student examination session">
  <title>Festacol · Examination Session</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <style type="text/tailwindcss">
    @theme{
      --font-sans:"DM Sans",sans-serif;
      --font-display:"Manrope",sans-serif;
      --font-serif:"Manrope",sans-serif;
    }
    html{scroll-behavior:smooth}
    body{background:#f4f4f4;color:#111}
    .page-enter{animation:page-enter .18s ease-out}
    @keyframes page-enter{from{opacity:.25;transform:translateY(4px)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
  <style>
    :root{--canvas:#f4f4f4;--paper:#fff;--ink:#101010;--muted:#686868;--line:#d4d4d4;--line-soft:#e8e8e8;--well:#eeeeee;--shadow:0 1px 2px rgba(0,0,0,.035),0 16px 36px rgba(0,0,0,.045);--shadow-float:0 22px 65px rgba(0,0,0,.12)}
    *{box-sizing:border-box}html{background:var(--canvas)}body{margin:0;background:var(--canvas);color:var(--ink)}body,button,input,select,textarea{font-family:"DM Sans",sans-serif}h1,h2,h3,h4,.font-display,.font-serif{font-family:"Manrope",sans-serif}::selection{background:#111;color:#fff}:focus-visible{outline:3px solid #111;outline-offset:3px}.focus-inverse:focus-visible{outline-color:#fff}
    .student-surface{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.student-surface-strong{background:#fff;border:1px solid #111;border-radius:16px;box-shadow:var(--shadow)}.student-ink{background:#111;color:#fff;border:1px solid #111}.session-kicker{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#717171}.session-title{font-family:"Manrope",sans-serif;font-weight:800;letter-spacing:-.045em}
    .exam-choice{position:relative;display:flex;min-height:58px;align-items:flex-start;gap:13px;border:1px solid #d3d3d3;border-radius:12px;background:#fff;padding:15px 16px;cursor:pointer;transition:border-color .15s,background-color .15s,box-shadow .15s,transform .15s}.exam-choice:hover{border-color:#777;background:#fafafa}.exam-choice:has(input:checked){border-color:#111;background:#111;color:#fff;box-shadow:0 10px 25px rgba(0,0,0,.12)}.exam-choice:has(input:focus-visible){outline:3px solid #111;outline-offset:3px}.exam-choice:has(input:checked):has(input:focus-visible){outline-color:#777}.exam-choice input{margin-top:2px;width:18px;height:18px;flex:0 0 auto;accent-color:#111}.exam-choice:has(input:checked) input{accent-color:#fff}.answer-marker{display:grid;width:26px;height:26px;flex:0 0 auto;place-items:center;border:1px solid #a8a8a8;border-radius:8px;background:#f4f4f4;font-size:11px;font-weight:800;color:#555}.exam-choice:has(input:checked) .answer-marker{background:#fff;border-color:#fff;color:#111}
    .exam-field{min-height:48px;width:100%;border:1px solid #bdbdbd;border-radius:11px;background:#fff;padding:11px 13px;font-size:16px;color:#111;transition:border-color .15s,box-shadow .15s}.exam-field:focus{border-color:#111;outline:0;box-shadow:0 0 0 3px rgba(17,17,17,.11)}.question-number{font-family:"Manrope",sans-serif;font-size:clamp(2.6rem,5vw,4.4rem);font-weight:800;line-height:.85;letter-spacing:-.07em;color:#dedede}.question-map-button{position:relative;display:grid;min-height:44px;place-items:center;border:1px solid #d2d2d2;border-radius:9px;background:#fff;color:#555;font-size:12px;font-weight:800;transition:border-color .15s,background-color .15s,color .15s,transform .15s}.question-map-button:hover{border-color:#777;color:#111}.question-map-button[data-state="answered"]{background:#111;border-color:#111;color:#fff}.question-map-button[data-state="incomplete"]{border-style:dashed;border-width:2px;border-color:#777;color:#111}.question-map-button[data-current="true"]{box-shadow:0 0 0 2px #fff,0 0 0 4px #111}.question-map-button[data-flagged="true"]::after{content:"";position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:999px;background:currentColor}
    .exam-toolbar{background:rgba(255,255,255,.95);backdrop-filter:saturate(140%) blur(14px);border-bottom:1px solid var(--line)}.exam-footer{background:rgba(255,255,255,.97);backdrop-filter:saturate(140%) blur(14px);border-top:1px solid var(--line)}.stat-cell{min-width:0;padding:14px 15px;border-right:1px solid #2d2d2d}.stat-cell:last-child{border-right:0}.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}.page-enter{animation:page-enter .18s ease-out}
    @media(max-width:639px){.exam-choice{min-height:56px;padding:14px}.question-map-button{min-height:44px}}@media(prefers-reduced-motion:reduce){.exam-choice:hover,.question-map-button:hover{transform:none}}
  </style>
</head>
<body class="student-page min-h-dvh font-sans antialiased">
  <a href="#app" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[70] focus:rounded-lg focus:bg-black focus:px-4 focus:py-3 focus:text-sm focus:font-bold focus:text-white">Skip to examination</a>
  <div id="app" tabindex="-1" class="min-h-dvh outline-none" aria-live="polite">
    <main class="min-h-dvh bg-black text-white"><div class="mx-auto flex min-h-dvh max-w-7xl items-center justify-center p-6"><div class="max-w-md text-center"><span class="mx-auto grid size-12 place-items-center rounded-lg bg-white font-display text-sm font-extrabold text-black">F</span><p class="mt-7 text-[11px] font-bold uppercase tracking-[.13em] text-neutral-500">Festacol examinations</p><h1 class="mt-3 font-display text-3xl font-extrabold tracking-[-.045em] sm:text-4xl">Resolving your session…</h1><p class="mt-4 text-sm leading-7 text-neutral-400">Reading the exact examination configuration from this link.</p></div></div></main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
  <script src="./js/session-store.js"></script>
  <script src="./js/question-data.js"></script>
  <script src="./js/student-app.js"></script>
</body>
</html>
