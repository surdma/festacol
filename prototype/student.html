<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Festacol student academic intelligence dashboard"><title>Festacol · Student Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/apexcharts"></script><style type="text/tailwindcss">@theme{--font-sans:"DM Sans",sans-serif;--font-display:"Manrope",sans-serif}html{scroll-behavior:smooth}.page-enter{animation:page-enter .2s ease-out}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}</style><link rel="stylesheet" href="./assets/festacol.css"><link rel="stylesheet" href="./assets/academic-v3.css"></head><body class="app-page min-h-dvh font-sans antialiased"><a href="#student-root" class="skip-link">Skip to dashboard</a><div id="student-root" tabindex="-1" class="min-h-dvh outline-none"><main class="grid min-h-dvh place-items-center p-6"><div class="surface-raised max-w-md p-7 text-center"><span class="brand-mark mx-auto">F</span><h1 class="mt-5 font-display text-2xl font-extrabold text-slate-900">Opening your academic workspace…</h1></div></main></div>
<button id="exam-id-launch" type="button" class="fixed bottom-4 right-4 z-40 inline-flex min-h-11 items-center gap-2 rounded-xl bg-black px-4 py-2.5 text-sm font-semibold text-white shadow-lg hover:bg-neutral-800 focus:outline-none focus:ring-4 focus:ring-neutral-300 sm:bottom-6 sm:right-6"><svg class="size-4" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h10a2 2 0 0 1 2 2v16H5V5a2 2 0 0 1 2-2Zm2 5h6M9 12h6m-6 4h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Enter exam ID</button>
<dialog id="exam-id-dialog" class="w-[calc(100%_-_1.5rem)] max-w-lg rounded-2xl border border-neutral-200 bg-white p-0 shadow-2xl backdrop:bg-black/45 sm:w-[calc(100%_-_3rem)]"><form id="exam-id-form" class="p-5 sm:p-6"><div class="flex items-start gap-4"><div class="min-w-0 flex-1"><p class="text-xs font-bold uppercase tracking-[.14em] text-neutral-500">Manual exam access</p><h2 class="mt-1 font-display text-2xl font-extrabold text-neutral-950">Enter the Exam ID.</h2><p class="mt-2 text-sm leading-6 text-neutral-600">Use the ID shown below the QR code by your school if you cannot scan it.</p></div><button id="exam-id-close" type="button" class="inline-flex size-10 shrink-0 items-center justify-center rounded-lg border border-neutral-300 hover:bg-neutral-100" aria-label="Close"><svg class="size-5" viewBox="0 0 24 24" fill="none"><path d="M6 18 18 6M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div><label class="mt-6 block text-sm font-semibold text-neutral-800">Exam ID<input id="exam-id-input" class="mt-2 block min-h-12 w-full rounded-lg border border-neutral-300 bg-white px-3 font-mono text-base uppercase tracking-[.12em] text-neutral-950 focus:border-black focus:ring-black" maxlength="20" autocomplete="off" placeholder="e.g. A1B2C3D4" required></label><div id="exam-id-error" class="mt-3 hidden rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-800" role="alert"></div><button class="mt-5 inline-flex min-h-11 w-full items-center justify-center rounded-lg bg-black px-4 text-sm font-semibold text-white hover:bg-neutral-800 focus:outline-none focus:ring-4 focus:ring-neutral-300" type="submit">Open examination</button></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script><script src="./js/session-store.js"></script><script src="./js/proctor-policy.js"></script><script src="./js/question-data.js"></script><script src="./js/assessment-engine.js"></script><script src="./js/student-dashboard.js"></script><script>(()=>{'use strict';const launch=document.getElementById('exam-id-launch'),dialog=document.getElementById('exam-id-dialog'),close=document.getElementById('exam-id-close'),form=document.getElementById('exam-id-form'),input=document.getElementById('exam-id-input'),error=document.getElementById('exam-id-error');launch.addEventListener('click',()=>{dialog.showModal();queueMicrotask(()=>input.focus());});close.addEventListener('click',()=>dialog.close());dialog.addEventListener('click',(event)=>{if(event.target===dialog)dialog.close();});dialog.addEventListener('cancel',(event)=>{event.preventDefault();dialog.close();});form.addEventListener('submit',(event)=>{event.preventDefault();error.classList.add('hidden');const Store=window.FestacolSessionStore,Policy=window.FestacolProctorPolicy;const id=input.value.trim().toUpperCase();const session=Store.findSessionById(id);if(!session){error.textContent='No examination matches that ID. Check the characters and try again.';error.classList.remove('hidden');return;}if(session.status==='draft'){error.textContent='This examination has not been published yet.';error.classList.remove('hidden');return;}const link=Policy.decorateStudentLink(Store.getSessionLink(session,location.href),Policy.getAdminPolicy(session.id).cameraRequired);location.assign(link);});})();</script></body></html>
