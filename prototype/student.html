<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Festacol Student route compatibility entry">
  <title>Festacol · Student</title>
</head>
<body>
  <script>
    (() => {
      const target = new URL('./index.html', location.href);
      target.search = location.search;
      target.searchParams.set('route', 'student');
      location.replace(target.href);
    })();
  </script>
  <noscript><p>JavaScript is required. <a href="./index.html?route=student">Open the Festacol Student workspace</a>.</p></noscript>
</body>
</html>
